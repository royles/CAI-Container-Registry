{# CDL-style 24px line icons (stroke, no emoji / 3D fills) #}
{% macro icon_repo(class='cdl-icon') %}
<svg class="{{ class }}" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M4 7.5L12 3.5L20 7.5V16.5L12 20.5L4 16.5V7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M12 12V20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20 7.5L12 12L4 7.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
{% endmacro %}

{% macro icon_replicate(class='cdl-icon') %}
<svg class="{{ class }}" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M7 7H4V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 7C5.5 4.8 8.1 3.5 11 3.5C15.4 3.5 19 7.1 19 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M17 17H20V20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 17C18.5 19.2 15.9 20.5 13 20.5C8.6 20.5 5 16.9 5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
{% endmacro %}

{% macro icon_api(class='cdl-icon') %}
<svg class="{{ class }}" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M8 9L4 12L8 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 9L20 12L16 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.5 7.5L10.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
{% endmacro %}

{% macro icon_overview(class='cdl-icon') %}
<svg class="{{ class }}" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
  <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
  <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
  <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
</svg>
{% endmacro %}
